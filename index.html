<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le mie scadenze</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icone/apple-touch-icon.png">
  <meta name="theme-color" content="#FF4E00">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      color: #2c3e50;
      text-align: center;
    }

    h2 {
      color: #2c3e50;
      text-align: center;
      margin-top: 40px;
    }

    p {
      text-align: center;
      color: #7f8c8d;
      font-style: italic;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background-color: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      border-left: 5px solid #3498db;
    }

    form {
      text-align: center;
      margin-top: 20px;
    }

    input, select {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <p style="text-align:left; font-style:normal;"><a href="/storico">Storico pagamenti</a></p>

  <h1>Le mie scadenze</h1>

  <p>Ecco le prossime scadenze da non dimenticare:</p>

  <div style="text-align: center; margin-bottom: 20px;">
    <button id="bottoneNotifiche">Attiva notifiche</button>
  </div>

  <ul id="elencoScadenze"></ul>

  <h2>Aggiungi una nuova scadenza</h2>
  <form id="formScadenza">
    <select id="inputNome" required>
      <option value="" disabled selected>Scegli il tipo di scadenza</option>
      <optgroup label="Veicolo">
        <option value="bollo" data-articolo="al" data-categoria="veicolo" data-durata="12">Bollo</option>
        <option value="revisione" data-articolo="alla" data-categoria="veicolo" data-durata="48">Revisione</option>
        <option value="tagliando" data-articolo="al" data-categoria="veicolo" data-durata="12">Tagliando</option>
        <option value="assicurazione veicolo" data-articolo="all'" data-categoria="veicolo" data-durata="12">Assicurazione veicolo</option>
      </optgroup>
      <optgroup label="Casa">
        <option value="assicurazione dell'animale domestico" data-articolo="all'" data-categoria="casa" data-durata="12">Assicurazione animale domestico</option>
        <option value="assicurazione incendio e scoppio casa" data-articolo="all'" data-categoria="casa" data-durata="12">Assicurazione incendio e scoppio (casa)</option>
        <option value="assicurazione furto e rapina casa" data-articolo="all'" data-categoria="casa" data-durata="12">Assicurazione furto e rapina (casa)</option>
        <option value="responsabilità civile famiglia" data-articolo="alla" data-categoria="casa" data-durata="12">Responsabilità civile famiglia</option>
        <option value="assicurazione eventi atmosferici casa" data-articolo="all'" data-categoria="casa" data-durata="12">Assicurazione eventi atmosferici (casa)</option>
        <option value="assicurazione prima casa" data-articolo="all'" data-categoria="casa" data-durata="12">Assicurazione prima casa</option>
        <option value="polizza vita" data-articolo="alla" data-categoria="casa" data-durata="12">Polizza vita</option>
        <option value="polizza infortuni familiare" data-articolo="alla" data-categoria="casa" data-durata="12">Polizza infortuni familiare</option>
        <option value="polizza malattia" data-articolo="alla" data-categoria="casa" data-durata="12">Polizza malattia / sanità integrativa</option>
        <option value="tutela legale" data-articolo="alla" data-categoria="casa" data-durata="12">Tutela legale</option>
        <option value="assicurazione catastrofale" data-articolo="all'" data-categoria="casa" data-durata="12">Assicurazione catastrofale (terremoto/alluvione)</option>
        <option value="assicurazione viaggio" data-articolo="all'" data-categoria="casa" data-durata="12">Assicurazione viaggio</option>
      </optgroup>
    </select>

    <input type="text" id="inputTarga" placeholder="Targa (solo per il veicolo, es. AB123CD)">
    <input type="text" id="inputVeicolo" placeholder="Nome veicolo (es. Smart, XADV, scooter)">

    <select id="inputDurata" required>
      <option value="6">Rinnovo ogni 6 mesi</option>
      <option value="12" selected>Rinnovo ogni 1 anno</option>
      <option value="24">Rinnovo ogni 2 anni</option>
      <option value="48">Rinnovo ogni 4 anni</option>
    </select>

    <input type="date" id="inputData" required>

    <button type="submit">Aggiungi</button>
  </form>

  <script>
    let oggi = new Date();

    let listaScadenze = DATI_SCADENZE;

    function calcolaGiorniMancanti(data) {
      let scadenzaData = new Date(data);
      let differenza = scadenzaData - oggi;
      let giorni = Math.round(differenza / (1000*60*60*24));
      return giorni;
    }

    function aggiornaBadge() {
      if (!("setAppBadge" in navigator)) {
        return;
      }

      let scadenzeUrgenti = 0;

      for (let i = 0; i < listaScadenze.length; i++) {
        let giorni = calcolaGiorniMancanti(listaScadenze[i].data);
        if (giorni <= 7) {
          scadenzeUrgenti = scadenzeUrgenti + 1;
        }
      }

      if (scadenzeUrgenti > 0) {
        navigator.setAppBadge(scadenzeUrgenti);
      } else {
        navigator.clearAppBadge();
      }
    }

    function formattaDurata(data) {
      let scadenza = new Date(data);

      // Calcolo sempre dalla data più vecchia verso quella più recente,
      // così la durata viene giusta sia per le scadenze future sia per quelle già passate
      let inizio = scadenza < oggi ? scadenza : oggi;
      let fine = scadenza < oggi ? oggi : scadenza;

      let anni = fine.getFullYear() - inizio.getFullYear();
      let mesi = fine.getMonth() - inizio.getMonth();
      let giorni = fine.getDate() - inizio.getDate();

      if (giorni < 0) {
        mesi = mesi - 1;
        let ultimoGiornoMesePrecedente = new Date(fine.getFullYear(), fine.getMonth(), 0).getDate();
        giorni = giorni + ultimoGiornoMesePrecedente;
      }

      if (mesi < 0) {
        anni = anni - 1;
        mesi = mesi + 12;
      }

      let parti = [];
      if (anni > 0) { parti.push(anni + (anni === 1 ? " anno" : " anni")); }
      if (mesi > 0) { parti.push(mesi + (mesi === 1 ? " mese" : " mesi")); }
      if (giorni > 0 || parti.length === 0) { parti.push(giorni + (giorni === 1 ? " giorno" : " giorni")); }

      if (parti.length === 1) {
        return parti[0];
      } else {
        let ultima = parti.pop();
        return parti.join(", ") + " e " + ultima;
      }
    }

    function mostraScadenze() {
      let contenitore = document.querySelector("#elencoScadenze");
      contenitore.innerHTML = "";

      for (let i = 0; i < listaScadenze.length; i++) {
        let giorni = calcolaGiorniMancanti(listaScadenze[i].data);
        let durata = formattaDurata(listaScadenze[i].data);
        let voce = document.createElement("li");

        let testo = "";
        if (giorni < 0) {
          testo = "⚠️ SCADUTA da " + durata + " — " + listaScadenze[i].nome;
        } else if (giorni < 30) {
          testo = "⚠️ URGENTE - Mancano " + durata + " " + listaScadenze[i].articolo + " " + listaScadenze[i].nome;
        } else {
          testo = "Mancano " + durata + " " + listaScadenze[i].articolo + " " + listaScadenze[i].nome;
        }

        if (listaScadenze[i].targa) {
          testo = testo + " (targa: " + listaScadenze[i].targa + ")";
        }

        if (listaScadenze[i].veicolo) {
          testo = testo + " " + listaScadenze[i].veicolo;
        }

        voce.textContent = testo;
        contenitore.appendChild(voce);
        let bottoneElimina = document.createElement("button");
bottoneElimina.textContent = "Elimina";
bottoneElimina.addEventListener("click", function() {
  let conferma = confirm("Sei sicuro di voler eliminare questa scadenza?");
  if (conferma) {
    fetch("/elimina-scadenza", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: listaScadenze[i]._id })
    }).then(function() {
      location.reload();
    });
  }
});
voce.appendChild(bottoneElimina);

let bottoneModifica = document.createElement("button");
bottoneModifica.textContent = "Modifica";
bottoneModifica.addEventListener("click", function() {
  let inputData = document.createElement("input");
  inputData.type = "date";
  inputData.value = listaScadenze[i].data;

  let bottoneSalva = document.createElement("button");
  bottoneSalva.textContent = "Salva";
  bottoneSalva.addEventListener("click", function() {
    fetch("/modifica-scadenza", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: listaScadenze[i]._id, data: inputData.value })
    }).then(function() {
      location.reload();
    });
  });

  voce.appendChild(inputData);
  voce.appendChild(bottoneSalva);
  bottoneModifica.remove();
});
voce.appendChild(bottoneModifica);

let bottonePagata = document.createElement("button");
bottonePagata.textContent = "Pagata";
bottonePagata.addEventListener("click", function() {
  fetch("/rinnova-scadenza", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: listaScadenze[i]._id })
  }).then(function() {
    location.reload();
  });
});
voce.appendChild(bottonePagata);
      }
    }
    mostraScadenze();
    aggiornaBadge();

    let form = document.querySelector("#formScadenza");

    let selectNome = document.querySelector("#inputNome");
    selectNome.addEventListener("change", function() {
      let opzioneScelta = selectNome.options[selectNome.selectedIndex];
      document.querySelector("#inputDurata").value = opzioneScelta.dataset.durata;
    });

    form.addEventListener("submit", function(evento) {
      evento.preventDefault();

      let opzioneScelta = selectNome.options[selectNome.selectedIndex];

      let nuovaScadenza = {
        nome: selectNome.value,
        articolo: opzioneScelta.dataset.articolo,
        categoria: opzioneScelta.dataset.categoria,
        targa: document.querySelector("#inputTarga").value,
        veicolo: document.querySelector("#inputVeicolo").value,
        durataMesi: Number(document.querySelector("#inputDurata").value),
        data: document.querySelector("#inputData").value
      };

      fetch("/aggiungi-scadenza", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(nuovaScadenza)
      }).then(function() {
        location.reload();
      });
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js");
    }

    async function aggiornaBottoneNotifiche() {
      let bottoneNotifiche = document.querySelector("#bottoneNotifiche");

      if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        bottoneNotifiche.style.display = "none";
        return;
      }

      if (Notification.permission !== "granted") {
        return;
      }

      let registrazione = await navigator.serviceWorker.ready;
      let abbonamentoEsistente = await registrazione.pushManager.getSubscription();

      if (abbonamentoEsistente) {
        bottoneNotifiche.textContent = "Notifiche attive";
        bottoneNotifiche.disabled = true;
      }
    }

    aggiornaBottoneNotifiche();

    const chiavePubblicaVapid = "BMP3OpHfK1kmd2gQ_kcD6eec0WV5AYte5Z4N7ZalXmAt0FY5gYw2jt8Al1VQDhMcXe9EsVck5sT1UAZdB1fTB88";

    function convertiChiave(chiaveBase64) {
      let base64 = chiaveBase64.replace(/-/g, "+").replace(/_/g, "/");
      let testoDecodificato = atob(base64);
      let array = new Uint8Array(testoDecodificato.length);

      for (let i = 0; i < testoDecodificato.length; i++) {
        array[i] = testoDecodificato.charCodeAt(i);
      }

      return array;
    }

    async function attivaNotifichePush() {
      let permesso = await Notification.requestPermission();

      if (permesso !== "granted") {
        alert("Permesso negato: non potrò mandarti le notifiche.");
        return;
      }

      let registrazione = await navigator.serviceWorker.ready;

      let abbonamento = await registrazione.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: convertiChiave(chiavePubblicaVapid)
      });

      fetch("/salva-abbonamento", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(abbonamento)
      }).then(function() {
        alert("Notifiche attivate!");
        aggiornaBottoneNotifiche();
      });
    }

    let bottoneNotifiche = document.querySelector("#bottoneNotifiche");
    bottoneNotifiche.addEventListener("click", attivaNotifichePush);
  </script>

</body>
</html>
